name: Build NKLauncher
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: NKLauncher-Windows
            sep: ";"
            icon: "--icon=icon.ico"
          - os: macos-latest
            artifact: NKLauncher-macOS
            sep: ":"
            icon: "--icon=icon.icns"
          - os: ubuntu-latest
            artifact: NKLauncher-Linux
            sep: ":"
            icon: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter tkinterdnd2 minecraft-launcher-lib pillow
      - name: Convert icon for macOS
        if: matrix.os == 'macos-latest'
        run: python -c "from PIL import Image; Image.open('icon.ico').save('icon.icns')"
      - run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name "NKLauncher" ${{ matrix.icon }} --add-data "icon.ico${{ matrix.sep }}." --collect-all customtkinter --collect-all tkinterdnd2 --collect-all minecraft_launcher_lib --collect-all PIL mclauncher.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
