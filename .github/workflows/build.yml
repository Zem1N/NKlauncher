name: Build NKLauncher (EXE, APP, DMG)
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: NKLauncher-Windows-EXE
            sep: ";"
            icon: "--icon=icon.ico --version-file=version_info.txt"
          - os: macos-latest
            artifact: NKLauncher-macOS-APP-DMG
            sep: ":"
            icon: "--icon=icon.icns"
          - os: ubuntu-latest
            artifact: NKLauncher-Linux
            sep: ":"
            icon: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter tkinterdnd2 minecraft-launcher-lib pillow
      - name: Convert icon for macOS
        if: matrix.os == 'macos-latest'
        run: python -c "from PIL import Image; Image.open('icon.ico').save('icon.icns')"
      - name: Build executable
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name "NKLauncher" ${{ matrix.icon }} --add-data "icon.ico${{ matrix.sep }}." --collect-all customtkinter --collect-all tkinterdnd2 --collect-all minecraft_launcher_lib --collect-all PIL mclauncher.py
      - name: Package macOS DMG
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dmg_root
          cp -R dist/NKLauncher.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "NKLauncher" -srcfolder dmg_root -ov -format UDZO dist/NKLauncher-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
